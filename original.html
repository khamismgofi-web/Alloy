<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8ff;--surface:#e9efff;--card:#fff;--text:#0f1524;--muted:#5b6478;--primary:#2563eb;--primary-d:#1d4fd0;--deep:#2456d6;--sand:#dfe8ff;--line:#dbe4f7;--on-primary:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;line-height:1.65}
h1,h2,h3{font-family:'DM Sans',system-ui,sans-serif;font-weight:600;line-height:1.1;margin:0 0 .5em;letter-spacing:-.03em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}h2{font-size:clamp(1.8rem,3.6vw,2.7rem)}h3{font-size:1.25rem;letter-spacing:0}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
section{padding:84px 0}
.alt{background:var(--surface)}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--primary-d);margin-bottom:14px}

nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:'DM Sans',system-ui,sans-serif;font-weight:600;font-size:1.1rem;text-decoration:none}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center}
.links{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.links a{text-decoration:none;color:var(--muted);font-size:.95rem;min-height:44px;display:inline-flex;align-items:center}
.links a:hover{color:var(--text)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--primary);color:var(--on-primary)!important;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:1rem;font-family:inherit}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)!important}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.hero{padding:64px 0 90px;overflow:hidden}
.hero .wrap{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:480px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:.85rem;margin-bottom:22px}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.mini{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.mini b{font-family:'DM Sans',system-ui,sans-serif;font-size:1.6rem;display:block;color:var(--primary-d)}
.mini span{font-size:.85rem;color:var(--muted)}
.art{position:relative;max-width:480px;margin:0 auto;width:100%}
.art svg{width:100%;height:auto;display:block}
.float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 14px 34px rgba(18,67,60,.14);font-size:.85rem}
.float b{display:block;font-size:.95rem}
.f1{left:-6px;bottom:52px}.f2{right:-6px;top:46px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;text-decoration:none;display:block}
.card .ico{width:52px;height:52px;border-radius:16px;background:var(--surface);display:grid;place-items:center;color:var(--primary-d);margin-bottom:18px}
.alt .card .ico{background:var(--sand)}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.head{max-width:560px;margin-bottom:44px}
.head p{color:var(--muted);margin:0}
.split{display:grid;gap:48px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:center}
.portrait{aspect-ratio:4/5;border-radius:200px 200px 24px 24px;background:linear-gradient(160deg,var(--sand),var(--surface));display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;padding:20px;border:1px solid var(--line)}
.ph{border:1px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center;padding:14px;aspect-ratio:4/3;background:var(--surface)}
.ba{position:relative;aspect-ratio:16/10;border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.ba div{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:.9rem}
.ba .after{background:linear-gradient(135deg,#d3f1e9,#8fdccb);color:#0b3b34}
.ba .before{background:linear-gradient(135deg,#e6dccb,#c6b89f);color:#3a3123;clip-path:inset(0 50% 0 0)}
.ba input{position:absolute;left:0;right:0;bottom:10px;width:100%;accent-color:var(--primary)}
.steps{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}
.steps div{counter-increment:s;padding-top:18px;border-top:2px solid var(--line);font-weight:600}
.steps div:before{content:"0" counter(s);display:block;font-family:'DM Sans',system-ui,sans-serif;font-size:2rem;color:var(--primary);margin-bottom:4px}
.steps small{display:block;font-weight:400;color:var(--muted)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:24px}
.tl div{margin-bottom:22px;position:relative}
.tl div:before{content:"";position:absolute;left:-31px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--primary)}
.tl b{color:var(--primary-d)}
.stars{color:#e0a93b;letter-spacing:2px}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:600;min-height:52px;display:flex;align-items:center}
details p{color:var(--muted);margin:0 0 12px}
.cta{padding:0 0 84px}
.panel{background:var(--deep);color:#f3faf7;border-radius:32px;padding:64px 28px;text-align:center}
.panel .btn{background:var(--sand);color:#12433c!important}
.panel .btn.ghost{background:transparent;color:#f3faf7!important;border-color:rgba(255,255,255,.4)}
footer{padding:40px 0 100px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
label{display:block;font-weight:500;margin:14px 0 6px;font-size:.92rem}
input,select,textarea{width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit}
.msg{padding:16px;border-radius:14px;background:var(--surface);margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}
.wide{overflow-x:auto}
.pill{font-size:.75rem;padding:3px 12px;border-radius:999px;background:var(--surface);color:var(--primary-d);border:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:11;box-shadow:0 8px 22px rgba(0,0,0,.25)}
@media (min-width:760px){.fab{display:none}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(18,67,60,.1)}}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}

ents": "Jinsi ninavyowahudumia wagonjwa", "[Principle 1]": "[Msingi wa 1]", "[Principle 2]": "[Msingi wa 2]", "[Principle 3]": "[Msingi wa 3]", "[Explanation]": "[Maelezo]", "Our treatments": "Matibabu yetu", "Clear treatments, explained before we start.": "Matibabu yaliyo wazi, yanayoelezwa kabla hatujaanza.", "How it works": "Inavyofanya kazi", "From booking to treatment": "Kuanzia kuweka miadi hadi matibabu", "Case gallery": "Matunzio ya kazi", "Real results": "Matokeo halisi", "Only cases patients agreed to share are shown here.": "Hapa zinaonyeshwa tu kazi ambazo wagonjwa wamekubali kushirikisha.", "View case": "Tazama kazi", "Case": "Kazi", "Case study": "Uchambuzi wa kazi", "Treatment:": "Matibabu:", "[Treatment approach]": "[Njia ya matibabu]", "Duration:": "Muda:", "[Duration]": "[Muda]", "Outcome:": "Matokeo:", "The patient gave consent to publish this case": "Mgonjwa amekubali kazi hii ichapishwe", "Patient education": "Elimu kwa wagonjwa", "Short guides, reviewed by the dentist before publishing.": "Miongozo mifupi, inayokaguliwa na daktari kabla ya kuchapishwa.", "Article image placeholder": "Nafasi ya picha ya makala", "Prevention": "Kinga", "Gentle, modern dental care for the whole family.":"Huduma ya upole na ya kisasa ya meno kwa familia nzima.","Cosmetic & Family Dentist":"Daktari wa Meno wa Urembo na Familia","Recommended by leading clinics and patients alike.":"Anapendekezwa na kliniki na wagonjwa kwa pamoja.","A calm, thorough approach to dental care, built around what each patient actually needs.":"Mtazamo wa utulivu na wa kina kwa huduma ya meno, uliojengwa kulingana na mahitaji halisi ya kila mgonjwa.","Clear guidance you can act on, not just a diagnosis.":"Ushauri ulio wazi unaoweza kufanyiwa kazi, si utambuzi tu.","Modern techniques, explained before we begin.":"Mbinu za kisasa, zinazoelezwa kabla hatujaanza.","Same-day slots kept open for urgent cases.":"Nafasi za siku hiyo hiyo zinawekwa wazi kwa dharura.","Every visit starts with listening, not a drill.":"Kila ziara huanza kwa kusikiliza, si kwa kuchimba jino.","You always know the steps and the cost before we start.":"Daima utajua hatua na gharama kabla hatujaanza.","Comfortable methods, kept up to date through ongoing training.":"Mbinu zenye faraja, zinazoboreshwa kupitia mafunzo endelevu.","Dr. Alo explained everything before starting and the whole visit was painless. My kids actually look forward to check-ups now.":"Dr. Alo alinieleza kila kitu kabla ya kuanza na ziara nzima haikuwa na maumivu. Watoto wangu sasa wanatarajia uchunguzi wa meno kwa hamu.","Grace":"Grace","Parent, long-time patient":"Mzazi, mgonjwa wa muda mrefu","Straightforward care for individuals and families, from routine check-ups to more involved treatment.":"Huduma iliyo wazi kwa watu binafsi na familia, kuanzia uchunguzi wa kawaida hadi matibabu makubwa zaidi.","Five years of steady, patient-first dental care in Mwanza.":"Miaka mitano ya huduma thabiti ya meno inayomweka mgonjwa mbele, Mwanza.","Care that starts with listening":"Huduma inayoanza kwa kusikiliza","I decided to become a dentist after watching a family member avoid care for years out of fear. That stayed with me, and it shapes how I treat every patient today: calmly, clearly, and without judgment.":"Niliamua kuwa daktari wa meno baada ya kumwona jamaa yangu akiepuka matibabu kwa miaka kwa sababu ya hofu. Hilo limebaki nami, na huathiri jinsi ninavyomhudumia kila mgonjwa leo: kwa utulivu, kwa uwazi, na bila hukumu.","Since qualifying, I've worked in general practice and cosmetic dentistry, and I still spend time mentoring dental students. Outside the clinic, I'm active in Mwanza's growing tech and education community.":"Tangu nihitimu, nimefanya kazi katika huduma za kawaida na urembo wa meno, na bado natumia muda kuwaelekeza wanafunzi wa meno. Nje ya kliniki, ninashiriki kikamilifu katika jamii inayokua ya teknolojia na elimu ya Mwanza.","TDA-2019-118, Tanzania Dental Association":"TDA-2019-118, Chama cha Madaktari wa Meno Tanzania","Tanzania Dental Association; annual continuing education in restorative and cosmetic dentistry":"Chama cha Madaktari wa Meno Tanzania; mafunzo endelevu ya kila mwaka katika ukarabati na urembo wa meno","Kiswahili, English":"Kiswahili, Kiingereza","Listen first":"Sikiliza kwanza","Explain clearly":"Eleza kwa uwazi","Treat gently":"Tibu kwa upole","Every plan starts with understanding what you're actually worried about.":"Kila mpango huanza kwa kuelewa ni nini hasa kinakusumbua.","No procedure starts until you know what to expect and why.":"Hakuna utaratibu unaoanza kabla hujajua nini cha kutarajia na kwa nini.","Comfort matters as much as the outcome.":"Faraja ni muhimu kama matokeo yenyewe.","Costs depend on the treatment. We always explain the price before we start, with no hidden fees.":"Gharama hutegemea matibabu. Tunaeleza bei kila wakati kabla hatujaanza, bila gharama zilizofichwa.","Most procedures use local anaesthesia, so you should feel little to no pain. We check in with you throughout.":"Taratibu nyingi hutumia dawa ya ganzi ya eneo husika, hivyo unapaswa kuhisi maumivu kidogo au bila kabisa. Tunakuuliza hali yako wakati wote.","A check-up usually takes 20 to 30 minutes. More involved treatments are scheduled with enough time so you are never rushed.":"Uchunguzi wa kawaida huchukua dakika 20 hadi 30. Matibabu makubwa zaidi hupangiwa muda wa kutosha ili usiharakishwe kamwe.","Call or WhatsApp the clinic number directly. We keep slots open each day for urgent cases.":"Piga simu au WhatsApp namba ya kliniki moja kwa moja. Tunaweka nafasi wazi kila siku kwa dharura.","We accept cash, mobile money, and card payments at the clinic.":"Tunakubali malipo ya fedha taslimu, pesa za simu, na kadi kwenye kliniki.","Adult, female: chipped front tooth":"Mtu mzima, mwanamke: jino la mbele lililopasuka","Composite bonding to restore the tooth shape":"Kuunganisha nyenzo maalum kurejesha umbo la jino","1 visit, about 45 minutes":"Ziara 1, kama dakik function tt(s){if(Object.prototype.hasOwnProperty.call(SW,s))return SW[s];for(const [r,g] of PAT){const m=s.match(r);if(m)return g(m)}return s}
function tr(root){if(LANG!='sw'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const list=[];while(n=w.nextNode())list.push(n);list.forEach(n=>{if(!n.parentElement||n.parentElement.closest('script,style'))return;const raw=n.nodeValue,k=raw.trim();if(!k)return;const v=tt(k);if(v!==k)n.nodeValue=raw.replace(k,v)});root.querySelectorAll('[placeholder],[aria-label],[alt],[title]').forEach(e=>['placeholder','aria-label','alt','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const x=tt(v);if(x!==v)e.setAttribute(a,x)}}))}

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function fuzzy(text,term){term=term.toLowerCase().trim();if(!term)return true;return text.toLowerCase().split(/\s+/).some(w=>w.includes(term)||(term.length>2&&lev(w.slice(0,term.length),term)<=Math.floor(term.length/4)+1))}

<section><div class="wrap faq2"><div><span class="eyebrow">FAQ</span><h2 class="big" style="font-size:clamp(2rem,4vw,3rem)">Common questions</h2><div class="card" style="margin-top:20px"><h3>Still have a question?</h3><p>${D.phone}</p><div class="row"><a class="btn" href="#/contact">Contact me</a></div></div></div><div>${D.faqs.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div></div></section>`+ctaP()+foot()},
about(){document.title='About | '+D.name;return topNav()+phead('About','About me','My story','Five years of steady, patient-first dental care in .')+`
<section><div class="wrap split"><div class="portrait" style="padding:0;overflow:hidden"><img src="${PHOTO}" alt="Portrait of ${D.name}" style="width:100%;height:100%;object-fit:cover;object-position:top;display:block"></div><div><span class="eyebrow">Career story</span><h2>Care that starts with listening</h2><p style="color:var(--muted)">I decided to become a dentist after watching a family member avoid care for years out of fear. That stayed with me, and it shapes how I treat every patient today: calmly, clearly, and without judgment.</p><p style="color:var(--muted)">Since qualifying, I've worked in general practice and cosmetic dentistry, and I still spend time mentoring dental students. Outside the clinic, I'm active in Mwanza's growing tech and education community.</p><div class="facts sm">${D.facts.map(t=>`<div><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div></section>
<section class="alt"><div class="wrap"><div class="head"><span class="eyebrow">Career timeline</span><h2>Education and experience</h2></div><div class="tlg">${D.timeline.map(t=>`<div class="card"><span class="pill">${t[0]}</span><h3 style="margin-top:14px;font-size:1.05rem">${t[1]}</h3></div>`).join('')}</div></div></section>
<section><div class="wrap"><div class="grid"><div class="card"><div class="ico">${IC.search}</div><h3>Registration</h3><p>TDA-2019-118, Tanzania Dental Association</p></div><div class="card"><div class="ico">${IC.spark}</div><h3>Memberships</h3><p>Tanzania Dental Association; annual continuing education in restorative and cosmetic dentistry</p></div><div class="card"><div class="ico">${IC.sun}</div><h3>Languages</h3><p>Kiswahili, English</p></div></div></div></section>
<section class="alt"><div class="wrap"><div class="head"><span class="eyebrow">Philosophy of care</span><h2>How I look after patients</h2></div><div class="grid">${[1,2,3].map(i=>`<div class="card"><b class="num">0${i}</b><h3>${['Listen first','Explain clearly','Treat gently'][i-1]}</h3><p>${['Every plan starts with understanding what you\'re actually worried about.','No procedure starts until you know what to expect and why.','Comfort matters as much as the outcome.'][i-1]}</p></div>`).join('')}</div></div></section>`+ctaP()+foot()},
services(){document.title='Services | '+D.name;return topNav()+phead('Services','Services','Our treatments','Clear treatments, explained before we start.')+`<section><div class="wrap"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(310px,1fr))">${svcCards(D.services)}</div></div></section><section class="alt"><div class="wrap"><div class="head"><span class="eyebrow">How it works</span><h2>From booking to treatment</h2></div><div class="steps"><div>Book<small>Choose a time that suits you</small></div><div>Consultation<small>We listen and examine</small></div><div>Treatment plan<small>Clear steps and costs</small></div><div>Treatment<small>Comfortable, careful care</small></div></div></div></section>`+ctaP()+foot()},
service(slug){const s=D.services.find(x=>x.slug==slug);if(!s)return pages.notfound();document.title=s.name+' | '+D.name;const rel=D.services.filter(x=>x.slug!=slug).slice(0,3);return topNav()+phead('Service','Treatment',s.name,s.short)+`<section><div class="wrap split" style="align-items:start"><div><div class="ilb big">${ILL[s.slug]}</div><p class="cap">${s.cap}</p><span class="eyebrow">Overview</span><h2>${s.name}</h2><p style="color:var(--muted)">${s.over}</p><h3 style="margin-top:32px">What to expect</h3><div class="steps">${s.steps.map(x=>`<div>${x}</div>`).join('')}</div></div><div class="card"><div class="ico">${IC[s.ic]}</div><h3>At a glance</h3><p>Visits: ${s.visits}</p><div class="row"><a class="btn" href="#/contact">Book this treatment</a></div></div></div></section><section class="alt"><div class="wrap"><div class="head"><span class="eyebrow">Related</span><h2>Other treatments</h2></div><div class="grid">${svcCards(rel)}</div></div></section>`+foot()},
cases(){document.title='Cases | '+D.name;const l=D.cases.filter(c=>c.public_consent);return topNav()+phead('Cases','Case gallery','Real results','Only cases patients agreed to share are shown here.')+`<section><div class="wrap"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${l.map(c=>`<div class="card"><div style="margin-bottom:16px">${ba('g'+c.id)}</div><h3>${c.concern}</h3><p>${c.out}</p><div class="row"><a class="btn ghost" href="#/cases/${c.id}">View case</a></div></div>`).join('')}</div></div></section>`+ctaP()+foot()},
case(id){const c=D.cases.find(x=>x.id==id&&x.public_consent);if(!c)return pages.notfound();document.title='Case | '+D.name;return topNav()+phead('Case','Case study',c.concern,'')+`<section><div class="wrap split" style="align-items:start"><div>${ba('c'+id)}</div><div class="card"><p><b>Treatment:</b> ${c.treat}</p><p><b>Duration:</b> ${c.dur}</p><p><b>Outcome:</b> ${c.out}</p><p class="pill" style="display:inline-block">The patient gave consent to publish this case</p><div class="row"><a class="btn" href="#/cases">All cases</a></div></div></div></section>`+foot()},
insights(){document.title='Insights | '+D.name;return topNav()+phead('Insights','Insights','Patient education','Short guides, reviewed by the dentist before publishing.')+`<section><div class="wrap"><div class="grid">${D.articles.map(a=>`<a class="card" href="#/insights/${a.slug}"><div class="tile" style="height:150px;margin-bottom:18px">Article image placeholder</div><span class="pill">${a.cat}</span><h3 style="margin-top:12px">${a.title}</h3><p>${a.time}</p></a>`).join('')}</div></div></section>`+ctaP()+foot()},
article(slug){const a=D.articles.find(x=>x.slug==slug);if(!a)return pages.notfound();document.title=a.title+' | '+D.name;return topNav()+phead('Insights',a.cat,a.title,a.time)+`<section><div class="wrap" style="max-width:720px"><p style="color:var(--muted)">[Article text to be written and medically reviewed by the dentist before publishing.]</p><div class="row"><a class="btn ghost" href="#/insights">All articles</a></div></div></section>`+ctaP()+foot()},
contact(){document.title='Contact | '+D.name;return topNav()+phead('Contact','Contact','Book an appointment','We will confirm your request by phone.')+`<section><div class="wrap split" style="align-items:start"><form id="f" class="card"><h2 style="font-size:1.5rem">Appointment request</h2><label for="a">Name</label><input id="a" required><label for="b">Phone</label><input id="b" type="tel" required><label for="c">Preferred date and time</label><input id="c" type="datetime-local" required><label for="d">Service</label><select id="d">${D.services.map(s=>`<option>${s.name}</option>`).join('')}</select><label for="e">Message</label><textarea id="e" rows="3"></textarea><div class="row"><button class="btn" type="submit">Send request</button></div><div id="r"></div></form><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Phone</h3><p>${D.phone}</p></div><div class="card"><h3>WhatsApp</h3><p>${D.whatsapp}</p></div><div class="card"><h3>Address</h3><p>${D.address}</p></div><div class="card"><h3>Hours</h3><p>${D.hours}</p></div><div class="card" style="grid-column:span 2"><div class="ph">Map placeholder</div></div><div class="card" style="grid-column:span 2"><h3>Emergency</h3><p>For urgent pain or swelling outside opening hours, call or WhatsApp the clinic number directly.</p></div></div></div></section>`+foot()},
staff(){document.title='Staff | '+D.name;if(!role)return topNav()+phead('Staff','Staff area','Staff login','Demo only. No real authentication yet.')+`<section><div class="wrap" style="max-width:420px"><div class="card"><label for="ro">Role</label><select id="ro"><option value="dentist">Dentist</option><option value="receptionist">Receptionist</option></select><div class="row"><button class="btn" id="go">Log in</button></div></div></div></section>`;return topNav()+`<section><div class="wrap"><div class="row" style="justify-content:space-between;margin:0 0 20px"><h1 style="margin:0">Dashboard <span class="pill">${role}</span></h1><button class="btn ghost" id="out">Log out</button></div><div class="grid" id="st" style="margin-bottom:28px"></div><h2 style="font-size:1.5rem">Patients</h2><input id="s" placeholder="Search patients, typos allowed" aria-label="Search patients"><div class="wide card" style="margin-top:14px;padding:8px"><table><thead><tr><th>Name</th><th>Plan</th><th>Status</th><th>Last visit</th>${role=='dentist'?'<th>Progress notes</th>':''}</tr></thead><tbody id="tb"></tbody></table></div><h2 style="margin-top:40px;font-size:1.5rem">Pending appointment requests</h2><div id="rq"></div></div></section>`},
notfound(){return topNav()+`<section><div class="wrap"><h1>Page not found</h1><a href="#/">Go home</a></div></section>`+foot()}
};
function drawPatients(){setTimeout(()=>{tr(q('#tb'));tr(q('#rq'));tr(q('#st'))},0);q('#st').innerHTML=[[D.patients.length,'Patients'],[requests.length,'Pending requests'],[4,'Reminders queued']].map(x=>`<div class="card stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');const t=q('#s')?q('#s').value:'';const rows=D.patients.filter(p=>fuzzy(p.n+' '+p.plan,t));q('#tb').innerHTML=rows.length?rows.map(p=>`<tr><td>${p.n}</td><td>${p.plan}</td><td><span class="pill">${p.status}</span></td><td>${p.last}</td>${role=='dentist'?`<td>${p.notes}</td>`:''}</tr>`).join(''):'<tr><td colspan="5">No patients match your search.</td></tr>';q('#rq').innerHTML=requests.length?requests.map(r=>`<div class="card" style="margin-bottom:10px"><b>${r.a}</b> (${r.b}) wants ${r.d} on ${r.c}<br><span class="pill">pending</span></div>`).join(''):'<p style="color:var(--muted)">No requests yet. Submit one from the Contact page.</p>'}
function route(){const p=location.hash.replace('#/','').split('/');const k=p[0]||'home';let h;if(k=='services'&&p[1])h=pages.service(p[1]);else if(k=='cases'&&p[1])h=pages.case(p[1]);else if(k=='insights'&&p[1])h=pages.article(p[1]);else if(pages[k]&&k!='service'&&k!='case'&&k!='article')h=pages[k]();else h=pages.notfound();q('#app').innerHTML=h;window.scrollTo(0,0);
const f=q('#f');if(f)f.onsubmit=e=>{e.preventDefault();requests.push({a:q('#a').value,b:q('#b').value,c:q('#c').value,d:q('#d').value});f.reset();q('#r').innerHTML='<div class="msg">Request sent. The clinic will confirm by phone.</div>';tr(q('#r'))};
const g=q('#go');if(g)g.onclick=()=>{role=q('#ro').value;route()};
const o=q('#out');if(o)o.onclick=()=>{role=null;route()};
if(q('#tb')){drawPatients();q('#s').oninput=drawPatients}tr(document.body)}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
